# MongoDB 7 as a single-node replica set (required for multi-document transactions)
# plus mongo-express for browsing data.
#
#   docker compose up -d
#   API:           MONGO_URI=mongodb://127.0.0.1:27018/stocksense?directConnection=true
#   mongo-express: http://localhost:8081  (admin / stocksense)
services:
  mongo:
    image: mongo:7.0
    container_name: stocksense-mongo
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27018:27017'
    volumes:
      - stocksense-mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first boot; afterwards it only reports status.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    container_name: stocksense-mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: 'true'
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: stocksense
    restart: unless-stopped

volumes:
  stocksense-mongo-data:
